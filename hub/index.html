          key: `${cur.year}-${String(month0 + 1).padStart(2, "0")}`,
          label: MONTHS[month0],
          year: cur.year,
          lastFriday: lastFridayOfMonth(cur.year, month0)

      });

        key: quarterKey(cur.year, cur.q),
        label: `Q${cur.q} ${cur.year}`,
        shortLabel: `Q${cur.q}`,
        role,
        year: cur.year,
        q: cur.q,
        lastFriday: lastFridayOfQuarter(cur.year, cur.q),

    // === Calendar ========================================================================

    //   teams:       team ids to include (null = all teams)
    //   skills:      skill ids to include (null = all skills)
    //   people:      allocation names; only records of these people count (null = everyone).
    //                Unassigned, no-team-assignee and committed-but-not-planned demand have no
    //                person, so they drop out under a people filter.
    //   issueFilter: issueIdx → boolean; which issues' demand counts (null = all). Capacity is
    //                never filtered by issue.
    // }
    //
    // Quarters are the current one and the next two; a week belongs to the quarter and month of
    // its Friday, and only weeks from the current week on count.
    function capacityBreakdown(computed, selection = {}, { now = new Date() } = {}) {
      const c = computed || {};
      const toSet = v => (v ? new Set(v) : null);
      const teams = toSet(selection.teams), skills = toSet(selection.skills), people = toSet(selection.people);
      const issueFilter = selection.issueFilter || null;
      const issueOk = new Map(); // memoised: a filter can be expensive (customer-scoped committed dates)
      const keepIssue = idx => {
        if (!issueFilter) return true;
        if (!issueOk.has(idx)) issueOk.set(idx, !!issueFilter(idx));
        return issueOk.get(idx);
      };
      const keep = r => (!teams || teams.has(r.team)) && (!skills || skills.has(r.skill)) && (!people || people.has(r.person));

      const baseQ = newCurrentQuarterIndex(now);
      const weeks = dashboardWeeks(c, { now });
      const visibleWeek = new Set(weeks);
      const quarters = [];
      const cells = {}; // quarterIdx → { capacity: {month: {skill: days}}, scheduled: {month: {skill: {days, byIssue}}}, pot: {skill: {days, byIssue}}, tbd: {...} }
      for (let i = 0; i < 3; i++) {
        const qi = baseQ + i;
        const qWeeks = weeks.filter(w => newQuarterIndexOfWeek(w) === qi);
        if (!qWeeks.length) continue;
        const months = [];
        qWeeks.forEach(w => { const m = weekYm(w); if (!months.includes(m)) months.push(m); });
        quarters.push({ quarterIdx: qi, label: 'Q' + ((qi % 4) + 1) + ' ' + Math.floor(qi / 4), weeks: qWeeks, months });
        cells[qi] = { capacity: {}, scheduled: {}, pot: {}, tbd: {} };
      }
      const addDemand = (slot, skill, days, issue) => {
        const cell = slot[skill] || (slot[skill] = { days: 0, byIssue: {} });
        cell.days += days;
        cell.byIssue[issue] = (cell.byIssue[issue] || 0) + days;
      };
      (c.capacityRecords || []).forEach(r => {
        if (!cells[r.quarter] || !visibleWeek.has(r.week) || !keep(r)) return;
        const byMonth = cells[r.quarter].capacity[r.month] || (cells[r.quarter].capacity[r.month] = {});
        byMonth[r.skill] = (byMonth[r.skill] || 0) + r.days;
      });
      (c.demandRecords || []).forEach(r => {
        if (!cells[r.quarter] || !keep(r) || !keepIssue(r.issue)) return;
        if (r.pot) { addDemand(cells[r.quarter].pot, r.skill, r.days, r.issue); return; }
        if (!visibleWeek.has(r.week)) return;
        const byMonth = cells[r.quarter].scheduled[r.month] || (cells[r.quarter].scheduled[r.month] = {});
        addDemand(byMonth, r.skill, r.days, r.issue);
      });
      (c.tbdRecords || []).forEach(r => {
        if (!cells[r.quarter] || !keep(r) || !keepIssue(r.issue)) return;
        addDemand(cells[r.quarter].tbd, r.skill, r.days, r.issue);
      });
      return { quarters, cells };
    }

    // Sums one slice of a capacityBreakdown:
    //   quarterIdx  the quarter
    //   months      months of that quarter to include (null = all its months)
    //   skills      skill ids to include (null = all)
    //   parts       'scheduled' (capacity + week-planned demand), 'pot', 'tbd' (default: all three)
    // Returns { capacity, demand, pot, tbd, totalDemand, net, byIssue: {issueIdx: {skill: days}} }
    // with net = capacity − demand − pot − tbd and totalDemand = demand + pot + tbd.
    function breakdownTotals(breakdown, { quarterIdx, months = null, skills = null, parts = ['scheduled', 'pot', 'tbd'] } = {}) {
      const out = { capacity: 0, demand: 0, pot: 0, tbd: 0, totalDemand: 0, net: 0, byIssue: {} };
      const cell = breakdown && breakdown.cells[quarterIdx];
      const q = breakdown && breakdown.quarters.find(x => x.quarterIdx === quarterIdx);
      if (!cell || !q) return out;
      const skillIds = skills || SKILL_IDS;
      const take = (slot, key) => skillIds.forEach(sk => {
        const d = slot && slot[sk];
        if (!d) return;
        out[key] += d.days;
        for (const idx in d.byIssue) {
          const o = out.byIssue[idx] || (out.byIssue[idx] = {});
          o[sk] = (o[sk] || 0) + d.byIssue[idx];
        }
      });
      if (parts.includes('scheduled')) {
        (months || q.months).forEach(m => {
          const capM = cell.capacity[m] || {};
          skillIds.forEach(sk => { out.capacity += capM[sk] || 0; });
          take(cell.scheduled[m], 'demand');
        });
      }
      if (parts.includes('pot')) take(cell.pot, 'pot');
      if (parts.includes('tbd')) take(cell.tbd, 'tbd');
      out.totalDemand = out.demand + out.pot + out.tbd;
      out.net = out.capacity - out.totalDemand;
      return out;
    }
    // One team's quarter totals as its unfiltered quarter cards show them, per skill too.
    function teamQuarterTotals(computed, teamId, { now = new Date() } = {}) {
      const bd = capacityBreakdown(computed, { teams: [teamId] }, { now });
      return bd.quarters.map(q => {
        const { capacity, demand, pot, tbd, net } = breakdownTotals(bd, { quarterIdx: q.quarterIdx });
        const bySkill = {};
        SKILL_IDS.forEach(sk => {
          const t = breakdownTotals(bd, { quarterIdx: q.quarterIdx, skills: [sk] });
          bySkill[sk] = { capacity: t.capacity, demand: t.demand, pot: t.pot, tbd: t.tbd, net: t.net };
        });
        return { quarterIdx: q.quarterIdx, label: q.label, weeks: q.weeks.length, capacity, demand, pot, tbd, net, bySkill };
      });
    }

    // ─── Shared rules ─────────────────────────────────────────────────────────────────────

    // Skill ids, in display order. Capacity and demand are split over these.
    const SKILL_IDS = ['backend', 'frontend', 'mobile', 'ai', 'bi', 'analyst', 'infra', 'other'];

    // The dashboard's visible weeks: from the current week through the end of current quarter + 2.
    function dashboardWeeks(computed, { now = new Date() } = {}) {
      const maxQ = newCurrentQuarterIndex(now) + 2;
      return ((computed && computed.sortedWeeks) || []).filter(w => newQuarterIndexOfWeek(w) <= maxQ);
    }

    // Maps an issue's explicit `team` string to a team id (by id or label, case-insensitively).
    // Anything unrecognised (including null) falls to "other". `config` = { teams }.
    function resolveNewTeamId(teamStr, config) {
      const teams = (config && config.teams) || [];
      if (!teamStr) return 'other';
      const norm = String(teamStr).trim().toLowerCase();
      for (const t of teams) {
        if (t.id.toLowerCase() === norm) return t.id;
        if ((t.label || '').toLowerCase() === norm) return t.id;
      }
      return 'other';
    }

    // A "pot" issue = assigned to a quarter but not exactly planned: start === end (a single day
    // rather than a real date range). Excludes holidays and Done/Won't-do/Duplicate work.
    function isPotIssue(iss) {
      if (!iss || !iss.start || !iss.end || iss.start !== iss.end) return false;
      if ((iss.type || '').includes('Holiday')) return false;
      if (iss.status === 'Done' || iss.status === "Won't do" || iss.status === 'Duplicate') return false;
      return true;
    }

    function personStartIdx(p) { return Math.min(...p.allocations.map(s => ymToIdx(s.from))); }

    // The allocation that applies in a month ('YYYY-MM'), or null. Which months an allocation
    // applies is resolved in dbt (int_engineering_team_allocations: applies_from_month,
    // applies_until_month); this only looks it up.
    function activeAllocation(p, ym) {
      return p.allocations.find(s => s.appliesFrom && s.appliesFrom <= ym && (!s.appliesUntil || ym < s.appliesUntil)) || null;
    }

    // The effective committed date (min of own + blocked-features' committed — see compute_).
    // `scopeMap` (issueIdx → committed | null) lets a caller recompute this scoped to e.g. one
    // customer's tasks; omit it (default null) for the base, unscoped value.
    function effCommitted(iss, scopeMap = null) {
      if (scopeMap && iss && iss.__idx != null && iss.__idx in scopeMap) return scopeMap[iss.__idx];
      return (iss && (iss.committedEff || iss.committed)) || null;
    }

    // "Overdue" — a committed date that WILL NOT be met: the planned end runs past the committed
    // date, OR the issue carries a committed date but was never planned (no start AND no end).
    // A "Done" issue is never overdue. `scopeMap` is forwarded to effCommitted.
    function isOverdue(iss, scopeMap = null) {
      if (!iss || iss.status === 'Done') return false;
      const cd = effCommitted(iss, scopeMap);
      if (!cd) return false;
      return !!((iss.end && iss.end > cd) || (!iss.start && !iss.end));
    }

    // =====================================================================================
    // Private helpers (suffix `_`): not part of the interface.
    // =====================================================================================

    const SKILLS_ = SKILL_IDS.map(id => ({ id }));

    // Feature effort columns → the model's per-team effort map and per-skill efforts.
    const TEAM_EFFORT_COLUMNS_ = {
      backend: 'effort_backend', frontend: 'effort_frontend', int_platform: 'effort_int_platform',
      int_orderfleet: 'effort_int_orderfleet', int_bookings: 'effort_int_bookings',
      int_financials: 'effort_int_financials', ai: 'effort_ai', bi: 'effort_bi', sre: 'effort_sre',
    };
    const SKILL_EFFORT_COLUMNS_ = {
      backend: 'effort_backend', frontend: 'effort_frontend', mobile: 'effort_mobile', ai: 'effort_ai',
      bi: 'effort_bi', analyst: 'effort_analyst', infra: 'effort_sre',
    };
    // Allocation capacity columns → skill ids.
    const ALLOCATION_SKILL_COLUMNS_ = {
      ai: 'capacity_ai', analyst: 'capacity_analytics', backend: 'capacity_backend', bi: 'capacity_bi',
      frontend: 'capacity_frontend', infra: 'capacity_infra', mobile: 'capacity_mobile', other: 'capacity_other',
    };

    // Notion page ids appear with and without hyphens; normalise before any lookup.
    function nid_(id) { return id ? String(id).replace(/-/g, '').toLowerCase() : ''; }
    function list_(v) { return Array.isArray(v) ? v.filter(x => x != null && String(x).trim()) : []; }
    function emails_(v) { return list_(v).map(String).filter(s => s.includes('@')); }
    function date_(v) { return v ? String(v).substring(0, 10) : null; }
    function num_(v) { return Number(v) || 0; }
    function text_(v) { return (v != null && String(v).trim() && String(v).trim() !== 'null') ? String(v).trim() : ''; }

    // Days off → { email, date, fraction, isPublic }. Without a daysOff input they come from
    // Holiday-type issues: a full, non-public day per weekday for each assignee.
    function buildDaysOff_(daysOff, issues) {
      if (daysOff) {
        return daysOff
          .map(r => ({ email: text_(r.employee_email), date: date_(r.day_off_date), fraction: num_(r.day_fraction), isPublic: r.is_public_holiday === true }))
          .filter(r => r.email && r.date && r.fraction > 0);
      }
      const out = [];
      issues.forEach(iss => {
        if (!(iss.type || '').includes('Holiday') || !iss.start || !iss.end) return;
        const s = toDate(iss.start), e = toDate(iss.end);
        if (isNaN(s) || isNaN(e) || e < s) return;
        for (let d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) {
          if (!isWeekday(d)) continue;
          (iss.assignedTo || []).forEach(email => out.push({ email, date: fmtYMD(d), fraction: 1, isPublic: false }));
        }
      });
      return out;
    }

    // Capacity weeks → { person, teamId, week, workDays, bookedHolidayDays, unbookedHolidayDays,
    // productiveDays, skillDays: { skill: days } }. The person and team are those of the
    // allocation that applies that week.
    function buildCapacityWeeks_(rows, allocation) {
      const byId = {};
      allocation.people.forEach(p => p.allocations.forEach(entry => { byId[entry.id] = { person: p.name, teamId: entry.teamId }; }));
      const out = [];
      rows.forEach(r => {
        const a = byId[nid_(r.engineering_team_allocation_id)];
        if (!a || !date_(r.week_start)) return;
        out.push({
          person: a.person, teamId: a.teamId, week: date_(r.week_start),
          workDays: num_(r.work_days), bookedHolidayDays: num_(r.booked_holiday_days),
          unbookedHolidayDays: num_(r.unbooked_holiday_days), productiveDays: num_(r.productive_days),
          skillDays: Object.fromEntries((Array.isArray(r.skill_days) ? r.skill_days : []).map(([sk, v]) => [sk, num_(v)])),
        });
      });
      return out;
    }

    // Holiday balances → email → { year: days }. A NULL balance (only uncapped policies) is no balance.
    function buildHolidayBalances_(balances) {
      const out = {};
      balances.forEach(r => {
        const email = text_(r.employee_email), year = text_(r.year);
        if (!email || !year || r.total_outstanding_balance == null) return;
        (out[email] = out[email] || {})[year] = num_(r.total_outstanding_balance);
      });
      return out;
    }

    // Deal status → the customer status categories the model carries.
    function dealStatusCategory_(status) {
      if (status === 'Live') return 'Live';
      if (status === 'Onboarding') return 'Onboarding';
      return 'Other';
    }

    // Display name of a deal and its customer group.
    // NOTE: `group` is company_name and `name` falls back deal_extract_name → qargo_group →
    // company_name. qargo_group looks like the intended group, so this may be the wrong way
    // round; kept as the app has always had it so no number or filter changes.
    function dealName_(d) { return text_(d.deal_extract_name) || text_(d.qargo_group) || text_(d.company_name); }
    function dealGroup_(d) { return text_(d.company_name); }

    // Input records → the issue model the computation runs on, plus the customer-task list.
    function buildIssues_({ features = [], customerTasks = [], deals = [] }) {
      const byId = records => {
        const m = new Map();
        records.forEach(r => { const id = nid_(r.notion_page_id); if (id && !m.has(id)) m.set(id, r); });
        return m;
      };
      const taskById = byId(customerTasks);
      const dealById = byId(deals);
      const featureById = byId(features);

      // Parent issues = features other features point to as their parent. Such roll-up issues
      // carry no estimate of their own (the children do).
      const parentIds = new Set();
      features.forEach(f => { const n = nid_(f.parent_task_notion_page_id); if (n) parentIds.add(n); });

      // Latest extraction time across features, for the "Notion synced" timestamp.
      let maxExtractedAt = null;
      features.forEach(f => { const v = f._extracted_at; if (v && (!maxExtractedAt || v > maxExtractedAt)) maxExtractedAt = v; });

      console.log('[ECR] buildModel: features:', featureById.size, '| tasks:', taskById.size, '| deals:', dealById.size);
      {
        // Features linking a customer task that isn't loaded (yet): normal when the app has only
        // its first, partial batch — those links fill in once the full data is loaded.
        let featuresWithGaps = 0, missingCtCount = 0;
        featureById.forEach(f => {
          const missing = list_(f.customer_tasks_notion_page_ids).filter(id => !taskById.has(nid_(id))).length;
          if (missing > 0) { featuresWithGaps++; missingCtCount += missing; }
        });
        if (featuresWithGaps > 0) console.log('[ECR] unresolved customer-task links:', missingCtCount, 'across', featuresWithGaps, 'feature(s)');
      }

      const issues = [];
      featureById.forEach(f => {
        const type = f.type || '';
        // "Customer configuration 🚂" records never enter the model.
        if (type.includes('Customer configuration')) return;
        const effortTotal = num_(f.effort);
        const efforts = {};
        Object.entries(TEAM_EFFORT_COLUMNS_).forEach(([key, col]) => { const v = num_(f[col]); if (v > 0) efforts[key] = v; });
        const effortPs = num_(f.effort_ps);
        if (effortPs > 0) efforts.professional_services = effortPs;
        const skillEfforts = {};
        Object.entries(SKILL_EFFORT_COLUMNS_).forEach(([skill, col]) => { skillEfforts[skill] = num_(f[col]); });
        const team = text_(f.team) || null;

        const preplannedOn = emails_(f.preplanned_on);
        const emails = new Set([...emails_(f.assigned_to), ...emails_(f.assigned_to_future_employee), ...preplannedOn]);

        // Customers = the linked customer tasks that are loaded, with their deal.
        const customersMap = new Map();
        list_(f.customer_tasks_notion_page_ids).forEach(ctId => {
          const ctKey = nid_(ctId);
          if (customersMap.has(ctKey)) return;
          const t = taskById.get(ctKey);
          if (!t) return;
          const deal = t.deals_extract_notion_page_id ? dealById.get(nid_(t.deals_extract_notion_page_id)) : null;
          const name = deal ? dealName_(deal) : text_(t.task_title);
          if (!name) return;
          customersMap.set(ctKey, {
            name,
            group:      deal ? dealGroup_(deal) : '',
            status:     deal ? dealStatusCategory_(deal.status) : 'Other',
            committed:  date_(t.committed_date),
            golive:     deal ? date_(deal.go_live_date) : null,
            url:        t.notion_page_url || '',
            id:         ctKey,
            dealId:     deal ? nid_(deal.notion_page_id) : '',
            dealUrl:    deal ? (deal.notion_page_url || '') : '',
            taskTitle:  t.task_title || '',
            taskType:   text_(t.task_type),
            priority:   text_(t.task_priority),
            taskStatus: text_(t.task_status),
          });
        });

        const parentPid = nid_(f.parent_task_notion_page_id);
        const parent = parentPid ? featureById.get(parentPid) : null;
        issues.push({
          id:              nid_(f.notion_page_id),
          url:             f.url || '',
          name:            f.title || '',
          status:          f.status || '',
          type,
          isParent:        parentIds.has(nid_(f.notion_page_id)) || list_(f.subtasks_notion_page_ids).length > 0,
          isSubtask:       !!parentPid,
          parentUrl:       parent ? (parent.url || '') : '',
          parentName:      parent ? (parent.title || '') : '',
          parentCommitted: parent ? date_(parent.committed_date) : null,
          blocks:          list_(f.blocks_notion_page_ids).map(nid_).filter(Boolean),
          preplannedOn,
          start:           date_(f.start_date),
          end:             date_(f.end_date),
          assignedTo:      [...emails],
          efforts,
          skillEfforts,
          team,
          effortTotal,
          customers:       [...customersMap.values()],
          committed:       date_(f.committed_date),
          golive:          false,
          tags:            list_(f.tags).map(s => String(s).trim()),
          priority:        text_(f.priority) || null,
        });
      });

      // Every loaded customer task, with its deal and linked feature ids (for the reverse view).
      const tasks = [];
      taskById.forEach(t => {
        const deal = t.deals_extract_notion_page_id ? dealById.get(nid_(t.deals_extract_notion_page_id)) : null;
        tasks.push({
          id:             nid_(t.notion_page_id),
          url:            t.notion_page_url || '',
          title:          t.task_title || '',
          type:           text_(t.task_type),
          priority:       text_(t.task_priority),
          status:         text_(t.task_status),
          committed:      date_(t.committed_date),
          assignedTeam:   text_(t.assigned_team),
          dealId:         deal ? nid_(deal.notion_page_id) : '',
          dealUrl:        deal ? (deal.notion_page_url || '') : '',
          customer:       deal ? dealName_(deal) : '',
          group:          deal ? dealGroup_(deal) : '',
          customerStatus: deal ? dealStatusCategory_(deal.status) : 'Other',
          golive:         deal ? date_(deal.go_live_date) : null,
          featureIds:     list_(t.features_notion_page_ids).map(nid_).filter(Boolean),
        });
      });

      return { issues, customerTasks: tasks, maxExtractedAt };
    }

    function slugTeam_(name) {
      return String(name || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    // Allocation records → the allocation plan: teams, and per person their time-bound team and
    // skill allocations. A person whose team or skills changed over time has one record per
    // allocation, all with the same title.
    function buildAllocation_(records, settings) {
      const byTitle = new Map();
      records.forEach(r => {
        if (!r.title) return;
        if (!byTitle.has(r.title)) byTitle.set(r.title, []);
        byTitle.get(r.title).push(r);
      });
      const teamNames = new Set();
      records.forEach(r => { if (r.team) teamNames.add(String(r.team).trim()); });
      const teams = [...teamNames].sort().map(name => ({ id: slugTeam_(name), name }));

      const people = [];
      byTitle.forEach((rows, title) => {
        rows.sort((a, b) => String(a.start_date || '').localeCompare(String(b.start_date || '')));
        const email = rows.map(r => r.email).find(Boolean) || null;
        const allocations = rows.map(r => {
          const skills = {};
          Object.entries(ALLOCATION_SKILL_COLUMNS_).forEach(([skill, col]) => { skills[skill] = Number(r[col]) || 0; });
          return {
            id: nid_(r.notion_page_id),
            // `from` (month) orders the roster (personStartIdx); appliesFrom/appliesUntil (months,
            // until exclusive) are the months the allocation applies (activeAllocation).
            from: String(r.start_date || '').substring(0, 7),
            appliesFrom: r.applies_from_month ? String(r.applies_from_month).substring(0, 7) : null,
            appliesUntil: r.applies_until_month ? String(r.applies_until_month).substring(0, 7) : null,
            fromDate: String(r.start_date || '').substring(0, 10),
            endDate: String(r.end_date || '').substring(0, 10),
            teamId: r.team ? slugTeam_(r.team) : '',
            lead: r.is_lead === true || r.is_lead === 'true',
            skills,
            pct: r.part_time_pct != null ? Number(r.part_time_pct) : 100,
          };
        });
        const person = { name: title, allocations };
        if (email) person.email = email;
        people.push(person);
      });
      people.sort((a, b) => a.name.localeCompare(b.name));
      return { settings, skillBreakdown: true, teams, people, tiPct: {} };
    }

    // The curated teams, in `order`, plus a trailing 'other' team. Every issue that matches no
    // curated team (by its team property or its assignees' membership) routes to 'other', which
    // has demand but no capacity of its own. A name in `order` with nobody allocated is skipped.
    function buildTeams_(allocation, order) {
      const byName = new Map((allocation.teams || []).map(t => [t.name, t]));
      const curated = order.map(name => byName.get(name)).filter(Boolean).map(t => ({ id: t.id, label: t.name }));
      return [...curated, { id: 'other', label: 'Other' }];
    }

    // Holiday issues contribute reduced demand (× 0.6).
    function newDemandFactor_(iss) {
      const t = (iss && iss.type) || '';
      return t.includes('Holiday') ? 0.6 : 1;
    }

    // "Technical improvement" issues — a reserved slice of team capacity.
    function isTechImpr_(iss) { return /technical improvement/i.test((iss && iss.type) || ''); }


    // The computation: model → per-team / per-person / per-week numbers and the records the
    // quarter numbers are summed from. See computeCapacity.
    function compute_(model, { now = new Date() } = {}) {
      const issues = model.issues;
      const DATA = { issues };
      const ALLOC = model.allocation;
      const config = { teams: model.teams, emailToName: model.emailToName };
      const { emailToName } = config;
      const productOwners = new Set(model.productOwnerEmails || []);
      // Effective committed date: the earliest of an issue's OWN committed sources (its own
      // committed_date + each linked customer request's committed date) and — following the
      // "blocks" chain recursively — the committed dates of the features it blocks. A blocker
      // inherits the earliest deadline it gates, so an undated blocker of a committed feature
      // becomes visibly overdue. Stored as iss.committedEff and used everywhere "committed" is
      // read (the ⚠ overdue check, the overdue filter, the rendered value + its drilldown).
      {
        issues.forEach((iss, i) => { iss.__idx = i; });

  // After layout: a label that doesn't fit its bar (its tags plus ~120px of title) moves right of the bar, in full.
